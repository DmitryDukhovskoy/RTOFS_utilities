---
# Monthly Bering Strait oceanic fluxes from Woodgate et al., 2018
# heat/FW low: minimum estimate of total f lux, estimated as the sum of the 
# A3 flux, the extra A4 flux (A4 add) and the 10m stratification correction;
# heat/FW hi = maximum estimate of the total flux, estimated as the sum of the A3 f lux,
# twice the extra A4 flux (2xWA4 add) and twice the 10m stratification 
# correction (equivalent to a 20m surface layer).
#
bering_fluxes:
  "Vol":
    # mSv, Sref=34.8
    mean: [0.7, 0.76, 0.89, 1.05, 1.43, 1.57, 1.46, 1.36, 0.99, 0.94, 0.66, 0.58]
    mean_err: [0.17, 0.2, 0.16, 0.16, 0.12, 0.11, 0.12, 0.08, 0.15, 0.15, 0.22, 0.26]
  "Heat_low":
    # TW, Tref=-1.9C, minimum estimate of total heat flux
    mean: [0.47, 0.37, 0.43, 0.73, 5.17, 18.1, 30.0, 32.5, 23.6, 18.4, 7.72, 1.79]
    mean_err: [0.11, 0.1, 0.08, 0.14, 0.89, 2.4, 3.2, 2.6, 3.2, 3.2, 3., 0.8]
  "Heat_high":
    # TW, Tref=-1.9C, minimum estimate of total heat flux
    mean: [0.56, 0.44, 0.52, 0.99, 6.76, 22.6, 38.0, 42.0, 29.1, 20.4, 7.97, 1.9]
    mean_err: [0.15, 0.11, 0.09, 0.2, 0.98, 2.6, 3.4, 3.1, 3.7, 3.4, 3.0, .83]
  "FW_low":
    # mSv, Sref=34.8 psu, min estimates of FW flux
    mean: [57, 48, 53, 59, 101., 119, 112, 103, 76, 76, 57, 54]
    mean_err: [14., 13, 10, 11, 10, 11, 10, 6, 10, 11, 18, 22]
