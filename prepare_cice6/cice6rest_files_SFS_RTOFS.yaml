---
# SFS runs with RTOFS ice thickness
# Directories and filenames for modifying CICE6 restart inserting hsnow, ithkn, iconc
# To be used with: prepare_cice6_restart_driver.py
# The driver will call functions to generate necessary restart files
# Input restart date and hr are read from the input restart file
# no need to specify
restart_time:
  rdate_in:  20250701   # input restart date, if ~ will be derived from flrst_in file
  rhr_in:    0          # input restart hour
  rdate_out: ~          # output restart date if different from input
  rhr_out:   ~          # output restart hour if different from input

cice_paths:
  #pth_in: '/gpfs/f6/sfs-emc/proj-shared/Dmitry.Dukhovskoy/RUNDIRS/restart_sfs_C192mx025/ice/'
  pth_in: '/gpfs/f6/sfs-emc/proj-shared/Dmitry.Dukhovskoy/RUNDIRS/restart_sfs_C192mx025/ice/cice6_global_RTOFS'
  pth_out: '/gpfs/f6/sfs-emc/proj-shared/Dmitry.Dukhovskoy/RUNDIRS/restart_sfs_C192mx025/ice/cice6_global_RTOFS'

mom6_paths:
  pth_in: '/gpfs/f6/sfs-emc/proj-shared/Dmitry.Dukhovskoy/RUNDIRS/restart_sfs_C192mx025/ocean'
  pth_out: '/gpfs/f6/sfs-emc/proj-shared/Dmitry.Dukhovskoy/RUNDIRS/restart_sfs_C192mx025/ocean/mom6_Tfrz_RTOFSice'
  pth_grid: '/gpfs/f6/sfs-emc/proj-shared/Dmitry.Dukhovskoy/RUNDIRS/ocean_grids'

rest_names:
# Input CICE6 restart file to be modified
# Output restart file name - specify final restart filename
# Note flrst_out if provided is the final restart file name 
# use ~ for empty input --> None in python, then final restart filename is created
#  if empty - name will be constructed using input restart name and rdate_out 
#  optional: if flrst_out is empty provide template to be used to construct 
#            restart files, after iconc, ithkn, hsnow, ... changed
#            tags will be added at the end: {flrst_tmp}.iconc_ithkn.hsnow.nc
#            YYYYMMDD.HH is space holder to indicate where restart date / time 
#            to put in the file name
#  e.g. flrst_in: 20250704.030000.cice_restart.iconc_ithkn.n
# flrst_tmp: "cice_restart.YYYYMMDD.HH"  --> cice_restart.20250704.00.iconc_ithkn.nc
#
  #flrst_in: "20250701.00.cice_model.res.nc"  # IC from GDAS SOCA no changes
  flrst_in: "cice_restart.20250701.00.iconc_ithkn.nc"
  flrst_out: ~
  flrst_tmp: "cice_restart.YYYYMMDD.HH"

mom6_names:
#  flmom_in: MOM6 restart file name, e.g.: 20240701.000000.MOM.res.nc
# varnm_temp - temperature Variable name in the MOM restart file
  flrst_in: ~
  varnm_temp: "Temp"

grid_topo:
  pthgrid: '/gpfs/f6/sfs-emc/proj-shared/Dmitry.Dukhovskoy/RUNDIRS/ocean_grids'
  pthdata: '/gpfs/f6/sfs-cpu/scratch/Dmitry.Dukhovskoy/data'

target_paths:
# Target fields directories and filenames to use in the IC
# For RTOFS - check version, it has changed in July 2025 to 2.5
  ice_conc:
    path: "/gpfs/f6/sfs-cpu/scratch/Dmitry.Dukhovskoy/data/NRT_NOAA_NSIDC_seaconc/{YR}"
    file: "NSIDC_iconc_interp_mesh025_1080x1440_{YR}{MM:02d}_{regn}.nc"

  ithkn_north:
    path: "/gpfs/f6/sfs-cpu/scratch/Dmitry.Dukhovskoy/RTOFS/cice4_fcast/{rdate}/interp_mesh025"
    file: "ithkn_RTOFSv2.4_{rdate}_fhr000_1080x1440.nc"

  ithkn_south:
    path: "/gpfs/f6/sfs-cpu/scratch/Dmitry.Dukhovskoy/RTOFS/cice4_fcast/{rdate}/interp_mesh025"
    file: "ithkn_RTOFSv2.4_{rdate}_fhr000_1080x1440.nc"

  hsnow_south:
    path: "/gpfs/f6/sfs-cpu/scratch/Dmitry.Dukhovskoy/data/snow_nasa/monthly_clim"
    file: "SSMI_hsnow_mnthclim_1992_2007_mesh025_1440x1080_south.nc"

  hsnow_north:
    path: "/gpfs/f6/sfs-cpu/scratch/Dmitry.Dukhovskoy/data/hsnow_clim_combined"
    file: "hsnow_mnthclim_Cryo_ICESat2_1440x1080_north.nc"


